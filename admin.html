<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HB.negoce | إدارة المنتجات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="auth-card" id="authView">
        <div class="brand-mark"><i class="fas fa-watch"></i></div>
        <h1>إدارة HB.negoce</h1>
        <p>سجّل دخولك لإدارة منتجات المتجر.</p>
        <form id="loginForm">
          <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="email" required /></label>
          <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
          <button class="primary-btn" type="submit"><i class="fas fa-right-to-bracket"></i> تسجيل الدخول</button>
        </form>
        <p class="hint">يجب تفعيل Email/Password في Firebase Authentication، ثم إنشاء حساب المدير من Firebase Console.</p>
        <p class="message" id="authMessage" role="alert"></p>
      </section>

      <section class="dashboard hidden" id="dashboardView">
        <header class="admin-header">
          <div><span class="eyebrow">لوحة التحكم</span><h1>إدارة المنتجات</h1></div>
          <div class="header-actions">
            <a href="index.html" target="_blank" class="secondary-btn"><i class="fas fa-store"></i> عرض المتجر</a>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-right-from-bracket"></i> خروج</button>
          </div>
        </header>

        <div class="notice" id="adminMessage" role="status"></div>
        <div class="dashboard-grid">
          <section class="panel form-panel">
            <div class="panel-heading">
              <h2 id="formTitle">إضافة منتج</h2>
              <button id="cancelEditBtn" class="text-btn hidden" type="button">إلغاء التعديل</button>
            </div>
            <form id="productForm">
              <input id="productId" type="hidden" />
              <div class="two-cols">
                <label>اسم المنتج<input id="name" required maxlength="120" placeholder="مثال: Rolex Submariner" /></label>
                <label>العلامة التجارية<input id="brand" required maxlength="60" placeholder="مثال: Rolex" /></label>
              </div>
              <div class="two-cols">
                <label>النوع<select id="type"><option value="كلاسيك">كلاسيك</option><option value="رياضي">رياضي</option></select></label>
                <label>السعر (درهم)<input id="price" type="number" min="0" step="1" required /></label>
              </div>
              <label>السعر السابق (اختياري)<input id="oldPrice" type="number" min="0" step="1" /></label>
              <label>الوصف<textarea id="desc" required maxlength="500" rows="3"></textarea></label>
              <label>المواصفات <span>— كل مواصفة في سطر</span><textarea id="specs" required rows="4" placeholder="حجم المينا: 40 ملم&#10;الزجاج: سافيرا"></textarea></label>
              <label>صور المنتج <span>— أول صورة هي الصورة الرئيسية</span><input id="images" type="file" accept="image/*" multiple /></label>
              <div class="current-images" id="currentImages"></div>
              <button class="primary-btn" id="saveBtn" type="submit"><i class="fas fa-floppy-disk"></i> حفظ المنتج</button>
            </form>
          </section>

          <section class="panel products-panel">
            <div class="panel-heading">
              <div>
                <h2>المنتجات المنشورة</h2>
                <p id="productsCount">جارٍ التحميل…</p>
              </div>
              <button id="importDefaultsBtn" type="button" class="secondary-btn"><i class="fas fa-cloud-arrow-up"></i> استيراد المنتجات الحالية</button>
            </div>
            <div id="productsList" class="products-list"></div>
          </section>
        </div>
      </section>
    </main>

    <script>
      function showAdminLoadError() {
        var message = document.getElementById('authMessage');
        if (message) message.textContent = 'تعذر تحميل Firebase. تأكد من رفع firebase-config.js وadmin.js إلى GitHub ومن فتح الموقع عبر GitHub Pages.';
      }
    </script>

    <script src="data.js"></script>
    <script type="module" src="firebase-config.js" onerror="showAdminLoadError()"></script>
    <script type="module" src="admin.js" onerror="showAdminLoadError()"></script>
  </body>
</html>
