<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>لوحة تحكم HB.negoce - دخول المشرف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .error { color: #e74c3c; text-align: center; margin-top: 10px; display: none; }
        .success { color: #27ae60; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required />
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="كلمة المرور" required />
            </div>
            <button type="submit">دخول</button>
        </form>
        <div class="error" id="error">البريد أو كلمة المرور غير صحيحة</div>
        <div class="success" id="success">تم الدخول بنجاح ✓</div>
    </div>

    <script>
        const CORRECT_EMAIL = 'hbnegoce7@gmail.com';
        const CORRECT_PASS = 'Nador123';
        const form = document.getElementById('loginForm');
        const error = document.getElementById('error');
        const success = document.getElementById('success');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const enteredEmail = document.getElementById('email').value;
            const enteredPass = document.getElementById('password').value;

            if (enteredEmail === CORRECT_EMAIL && enteredPass === CORRECT_PASS) {
                error.style.display = 'none';
                success.style.display = 'block';
                alert('مرحباً بك في لوحة التحكم!');
                // هنا يمكن توجيه الصفحة للوحة تحكم حقيقية أو إعادة تحميل الصفحة
            } else {
                error.style.display = 'block';
                success.style.display = 'none';
            }
        });
    </script>
</body>
</html>
