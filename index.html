<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hbnegoce | جار الصيانة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }

      :root {
        --bg: #0a0e1a;
        --heading: #f8fafc;
        --text: #cbd5e1;
        --accent-gradient: linear-gradient(135deg, #22d3ee, #818cf8, #e879f9);
      }

      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        background: radial-gradient(800px 420px at 50% -10%, rgba(34, 211, 238, 0.14), transparent),
                    radial-gradient(700px 400px at 15% 100%, rgba(167, 139, 250, 0.14), transparent),
                    radial-gradient(600px 300px at 90% 90%, rgba(232, 121, 249, 0.1), transparent),
                    var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      .maintenance {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        padding: 60px 24px;
        text-align: center;
      }

      .maintenance-robot { animation: robot-bounce 3s ease-in-out infinite; }

      @keyframes robot-bounce {
        0%, 100% { transform: translateY(0); }
        40% { transform: translateY(-14px); }
        70% { transform: translateY(4px); }
      }

      .robot-svg { width: 240px; max-width: 70vw; display: block; }

      .robot-head { animation: robot-tilt 5s ease-in-out infinite; transform-origin: 160px 120px; }

      @keyframes robot-tilt {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      .robot-eye { animation: robot-blink 3.4s infinite; }
      .robot-eye.left { transform-origin: 130px 110px; }
      .robot-eye.right { transform-origin: 190px 110px; }

      @keyframes robot-blink {
        0%, 45%, 55%, 100% { transform: scaleY(1); }
        48%, 52% { transform: scaleY(0.1); }
      }

      .robot-pupil { animation: robot-look 4s ease-in-out infinite; }

      @keyframes robot-look {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(5px, 2px); }
        50% { transform: translate(0, 0); }
        75% { transform: translate(-5px, -2px); }
      }

      .robot-mouth { animation: robot-talk 0.9s ease-in-out infinite; transform-origin: center; }

      @keyframes robot-talk {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(0.7); }
      }

      .robot-antenna { animation: robot-wiggle 1.2s ease-in-out infinite; transform-origin: 160px 62px; }

      @keyframes robot-wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(12deg); }
        75% { transform: rotate(-12deg); }
      }

      .robot-arm.left { animation: robot-wave 1.6s ease-in-out infinite; transform-origin: 93px 196px; }

      @keyframes robot-wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(14deg); }
        55% { transform: rotate(-8deg); }
      }

      .robot-arm.right { animation: robot-wave-r 1.6s ease-in-out infinite 0.3s; transform-origin: 227px 196px; }

      @keyframes robot-wave-r {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-14deg); }
        55% { transform: rotate(8deg); }
      }

      .gear-left { animation: robot-spin 4s linear infinite; transform-origin: 160px 222px; }
      .gear-right { animation: robot-spin 3s linear infinite reverse; transform-origin: 160px 242px; }

      @keyframes robot-spin {
        to { transform: rotate(360deg); }
      }

      .robot-leg.left { animation: robot-walk 1.1s ease-in-out infinite; transform-origin: 142px 302px; }
      .robot-leg.right { animation: robot-walk 1.1s ease-in-out infinite reverse; transform-origin: 178px 302px; }

      @keyframes robot-walk {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(10deg); }
      }

      .maintenance-text { max-width: 560px; }

      .maintenance-logo {
        display: inline-block;
        font-size: 2rem;
        font-weight: 900;
        color: #fff;
        margin-bottom: 14px;
        letter-spacing: 1px;
      }

      .maintenance-logo span {
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .maintenance-text h1 {
        font-size: 2.6rem;
        font-weight: 900;
        margin: 0 0 12px;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .maintenance-text p { font-size: 1.15rem; color: #94a3b8; margin: 0; }

      @media (max-width: 600px) {
        .maintenance-text h1 { font-size: 1.9rem; }
        .maintenance-logo { font-size: 1.6rem; }
        .maintenance-text p { font-size: 1rem; }
      }
    </style>
  </head>
  <body>
    <div class="maintenance">
      <div class="maintenance-robot">
        <svg viewBox="0 0 320 380" class="robot-svg" aria-hidden="true">
          <defs>
            <linearGradient id="robotGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="100%" stop-color="#818cf8" />
            </linearGradient>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0a0e1a" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#090b14" stop-opacity="0.95" />
            </linearGradient>
          </defs>

          <ellipse cx="160" cy="365" rx="95" ry="10" fill="#000" opacity="0.4" />

          <g class="robot-antenna">
            <line x1="160" y1="62" x2="160" y2="30" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" />
            <circle cx="160" cy="24" r="9" fill="#e879f9">
              <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite" />
            </circle>
          </g>

          <g class="robot-head">
            <rect x="95" y="68" width="130" height="100" rx="24" fill="url(#robotGrad)" />
            <rect x="95" y="68" width="130" height="100" rx="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
            <g class="robot-eye left">
              <circle cx="130" cy="110" r="15" fill="#0a0e1a" />
              <circle class="robot-pupil" cx="130" cy="110" r="7" fill="#22d3ee" />
              <circle cx="133" cy="106" r="2.5" fill="#fff" />
            </g>
            <g class="robot-eye right">
              <circle cx="190" cy="110" r="15" fill="#0a0e1a" />
              <circle class="robot-pupil" cx="190" cy="110" r="7" fill="#22d3ee" />
              <circle cx="193" cy="106" r="2.5" fill="#fff" />
            </g>
            <rect class="robot-mouth" x="142" y="138" width="36" height="10" rx="5" fill="#0a0e1a" />
            <rect x="150" y="141" width="20" height="4" rx="2" fill="#e879f9" />
          </g>

          <rect class="robot-neck" x="150" y="168" width="20" height="14" rx="4" fill="#818cf8" />

          <rect class="robot-body" x="115" y="182" width="90" height="120" rx="18" fill="url(#robotGrad)" />
          <rect class="robot-inset" x="133" y="200" width="54" height="60" rx="10" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
          <g class="robot-gears">
            <g class="gear gear-left">
              <circle cx="160" cy="222" r="15" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4 3" />
              <circle cx="160" cy="222" r="4" fill="#22d3ee" />
            </g>
            <g class="gear gear-right">
              <circle cx="160" cy="242" r="9" fill="none" stroke="#e879f9" stroke-width="3" stroke-dasharray="3 2.5" />
              <circle cx="160" cy="242" r="3" fill="#e879f9" />
            </g>
          </g>
          <circle class="robot-pulse" cx="160" cy="270" r="6" fill="#4ade80">
            <animate attributeName="r" values="5;7;5" dur="1.2s" repeatCount="indefinite" />
          </circle>
          <rect x="125" y="290" width="70" height="8" rx="4" fill="rgba(10,14,26,0.5)" />
          <circle cx="134" cy="294" r="3" fill="#22d3ee" />
          <circle cx="180" cy="294" r="3" fill="#e879f9" />

          <g class="robot-arm left">
            <rect x="82" y="196" width="22" height="62" rx="11" fill="#818cf8" />
            <g class="robot-works">
              <circle cx="93" cy="268" r="10" fill="#22d3ee">
                <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
              </circle>
              <circle cx="93" cy="268" r="20" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5">
                <animate attributeName="r" values="20;26;20" dur="1.2s" repeatCount="indefinite" />
              </circle>
            </g>
          </g>

          <g class="robot-arm right">
            <rect x="216" y="196" width="22" height="62" rx="11" fill="#818cf8" />
          </g>

          <rect class="robot-leg left" x="130" y="302" width="24" height="48" rx="10" fill="#22d3ee" />
          <rect class="robot-foot left" x="126" y="342" width="32" height="12" rx="6" fill="#a78bfa" />
          <rect class="robot-leg right" x="166" y="302" width="24" height="48" rx="10" fill="#22d3ee" />
          <rect class="robot-foot right" x="162" y="342" width="32" height="12" rx="6" fill="#a78bfa" />
        </svg>
      </div>

      <div class="maintenance-text">
        <span class="maintenance-logo">hb<span>negoce</span></span>
        <h1>جار الصيانة</h1>
        <p>نعمل حاليًا على تحسين الموقع ليعود إليك أفضل من ذي قبل. شكرًا لصبرك!</p>
      </div>
    </div>
  </body>
</html>
